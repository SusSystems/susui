// ─── PHASE-AWARE BUILD LOG ─────────────────────────────────
function BuildLog({ log, derivation }) {
  // Parse log lines into nix build phases
  const phases = useMemo(() => {
    if (!log || log.length === 0) return [];
    const result = [];
    let current = { name: "preamble", lines: [], important: false };

    for (const line of log) {
      const t = line.text;
      // Detect phase boundaries: "Running phase: fooPhase"
      const phaseMatch = t.match(/^Running phase:\s*(\S+)/);
      if (phaseMatch) {
        if (current.lines.length > 0) result.push(current);
        const phaseName = phaseMatch[1];
        current = { name: phaseName, lines: [], important: phaseName === "checkPhase" };
        // Don't add the "Running phase:" line itself — we use the header
        continue;
      }
      // Skip @nix structured markers and "got build log" preamble
      if (/^@nix\s/.test(t) || /^got build log for/.test(t)) continue;
      // Skip the cached-log header line from our enrichment
      if (/^─── cached build log/.test(t)) continue;
      current.lines.push(line);
    }
    if (current.lines.length > 0) result.push(current);

    // Trim empty preamble
    if (result.length > 0 && result[0].name === "preamble" && result[0].lines.length === 0) {
      result.shift();
    }

    return result;
  }, [log]);

  // If no phases detected (e.g. derivation metadata fallback), render flat
  if (phases.length <= 1 && !phases.some(p => p.name !== "preamble")) {
    return html`
      <div style=${{ padding: "6px 0", maxHeight: 400, overflowY: "auto" }}>
        ${log.map((line, i) => html`<${LogLine} key=${i} number=${line.n} content=${line.text} level=${line.level} />`)}
      </div>
    `;
  }

  const isCheck = derivation && derivation.startsWith("checks.");

  // Auto-expand: checkPhase always; buildPhase only if NOT a checks.* derivation
  // For checks: collapse buildPhase (the huge compilation), expand checkPhase
  const initialOpen = {};
  phases.forEach(p => {
    if (p.name === "checkPhase") initialOpen[p.name] = true;
    else if (p.name === "buildPhase") initialOpen[p.name] = !isCheck;
    else if (p.name === "preamble") initialOpen[p.name] = false;
    else initialOpen[p.name] = !isCheck; // for checks.*, collapse everything except checkPhase
  });
  const [open, setOpen] = useState(initialOpen);
  const toggle = (name) => setOpen(prev => ({ ...prev, [name]: !prev[name] }));

  const phaseLabel = (name) => {
    const map = {
      preamble: "preamble",
      unpackPhase: "unpack",
      patchPhase: "patch",
      updateAutotoolsGnuConfigScriptsPhase: "autotools",
      configurePhase: "configure",
      buildPhase: "build",
      checkPhase: "check / test",
      installPhase: "install",
      fixupPhase: "fixup",
    };
    return map[name] || name;
  };

  const phaseIcon = (name, lines) => {
    if (name === "checkPhase") {
      const hasFailure = lines.some(l => l.level === "error");
      return hasFailure ? "✕" : "✓";
    }
    return "›";
  };

  const phaseColor = (name, lines) => {
    if (name === "checkPhase") {
      const hasFailure = lines.some(l => l.level === "error");
      return hasFailure ? T.color.fail400 : T.color.pass400;
    }
    return T.color.textTertiary;
  };

  return html`
    <div style=${{ maxHeight: 500, overflowY: "auto" }}>
      ${phases.map(phase => html`
        <div key=${phase.name}>
          <div onClick=${() => toggle(phase.name)}
            style=${{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", cursor: "pointer",
              background: open[phase.name] ? T.color.surface2 + "60" : "transparent",
              borderBottom: "1px solid " + T.color.borderSubtle + "60",
              userSelect: "none" }}>
            <span style=${{ fontFamily: T.font.mono, fontSize: 10, color: phaseColor(phase.name, phase.lines),
              transform: open[phase.name] ? "rotate(90deg)" : "rotate(0deg)",
              transition: "transform 150ms ease", display: "inline-block", width: 10 }}>
              ${phaseIcon(phase.name, phase.lines)}
            </span>
            <span style=${{ fontFamily: T.font.mono, fontSize: 11, fontWeight: 600, color: phaseColor(phase.name, phase.lines),
              letterSpacing: "0.02em" }}>
              ${phaseLabel(phase.name)}
            </span>
            <span style=${{ fontFamily: T.font.mono, fontSize: 10, color: T.color.textTertiary, marginLeft: "auto" }}>
              ${phase.lines.length} line${phase.lines.length !== 1 ? "s" : ""}
            </span>
          </div>
          ${open[phase.name] && html`
            <div style=${{ padding: "4px 0" }}>
              ${phase.lines.map((line, i) => html`<${LogLine} key=${i} number=${line.n} content=${line.text} level=${line.level} />`)}
            </div>
          `}
        </div>
      `)}
    </div>
  `;
}

// ─── OVERRIDE INPUT PILL ────────────────────────────────────
function OverridePill({ inputName, type, owner, repo, ref: gitRef, pr, flakeRef }) {
  const isGH = type === "github";
  const short = (gitRef && gitRef.length > 12) ? gitRef.slice(0, 7) : gitRef;
  const flakeInputUri = isGH ? "github:" + owner + "/" + repo + "/" + gitRef : gitRef;
  const hintCmds = [
    { label: "Reproduce with this override", cmd: "nix build " + (flakeRef || ".") + " --override-input " + inputName + " " + flakeInputUri, source: "nix" },
    { label: "Inspect original input", cmd: "nix flake metadata " + (flakeRef || ".") + " --json | jq '.locks.nodes.\"" + inputName + "\"'", source: "nix" },
  ];
  if (isGH) hintCmds.push({ label: "Fetch commit info", cmd: "gh api repos/" + owner + "/" + repo + "/commits/" + (gitRef || "HEAD") + " --jq '.sha, .commit.message'", source: "github" });
  if (pr) hintCmds.push({ label: "PR details", cmd: "gh pr view " + pr + " --repo " + owner + "/" + repo + " --json title,state,mergeCommit", source: "github" });
  const hintFiles = [
    { path: "flake.lock", desc: "Current pinned revision for " + inputName },
    { path: "flake.nix", desc: "Input declaration" },
  ];
  const pill = html`
    <div style=${{ display: "inline-flex", alignItems: "center", gap: 6, padding: "4px 10px 4px 8px", background: T.color.surface2, border: "1px solid " + T.color.border, borderRadius: T.radius.sm, fontSize: T.fontSize.xs, fontFamily: T.font.mono, lineHeight: 1, transition: "all " + T.transition.fast }}>
      <span style=${{ color: T.color.pending400, fontWeight: 600, fontSize: 10, letterSpacing: "0.03em" }}>OVERRIDE</span>
      <span style=${{ width: 1, height: 12, background: T.color.border }} />
      <span style=${{ color: T.color.textSecondary, fontWeight: 500 }}>${inputName}</span>
      ${isGH && html`
        <span style=${{ width: 1, height: 12, background: T.color.border }} />
        <a href=${"https://github.com/" + owner + "/" + repo} target="_blank" rel="noopener" class="gh-link" style=${{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: T.fontSize.xs }} onClick=${e => e.stopPropagation()}>
          <${GHIcon} size=${10} /> <span>${owner}/${repo}</span>
        </a>
      `}
      ${isGH && gitRef && html`
        <a href=${"https://github.com/" + owner + "/" + repo + "/commit/" + gitRef} target="_blank" rel="noopener" class="gh-link" style=${{ fontSize: T.fontSize.xs, color: T.color.saku300 }} onClick=${e => e.stopPropagation()}>${short}</a>
      `}
      ${pr && html`
        <a href=${"https://github.com/" + owner + "/" + repo + "/pull/" + pr} target="_blank" rel="noopener" class="gh-link" style=${{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: T.fontSize.xs, color: T.color.running400, padding: "1px 5px", background: T.color.running400 + "12", borderRadius: T.radius.xs, border: "1px solid " + T.color.running400 + "20" }} onClick=${e => e.stopPropagation()}>PR #${pr}</a>
      `}
      ${!isGH && gitRef && html`<span style=${{ color: T.color.textTertiary }}>${gitRef}</span>`}
    </div>
  `;
  return html`<${DataHint} commands=${hintCmds} files=${hintFiles} position="below" notes="--override-input temporarily replaces the flake.lock pin for this input during evaluation.">${pill}</${DataHint}>`;
}

  const cfg = statusConfig[build.status] || statusConfig.pending;

  const commitUrl = build.owner && build.repo && build.commit

  const flakeTarget = build.flakeRef + "#" + build.derivation;
  const overrideArgs = (build.overrideInputs || []).map(oi =>
    " --override-input " + oi.inputName + " " + (oi.inputType === "github" ? "github:" + (oi.owner||"") + "/" + (oi.repo||"") + "/" + (oi.ref||oi.gitRef||"") : (oi.ref||oi.gitRef||""))
  ).join("");

  const statusHint = [
    { label: "Reproduce this build", cmd: "nix build " + flakeTarget + overrideArgs + "\necho $?", source: "nix" },
    { label: "Evaluate without building", cmd: "nix eval " + flakeTarget + " --raw 2>&1", source: "nix" },
  ];
  const derivationHint = [
    { label: "Show derivation path", cmd: "nix path-info --derivation " + flakeTarget, source: "nix" },
    { label: "List outputs", cmd: "nix derivation show " + flakeTarget + " | jq '.[].outputs'", source: "nix" },
  ];
  const branchHint = [
    { label: "Current branch", cmd: "git branch --show-current", source: "git" },
  ];
  const commitHint = [
    { label: "Commit details", cmd: "git log -1 --format='%H%n%s%n%an%n%ai' " + shortSha, source: "git" },
  ];
  const durationHint = [
    { label: "Reproduce with timing", cmd: "time nix build " + flakeTarget + overrideArgs, source: "shell" },
  ];
  const logHintCmds = [
    { label: "Retrieve build log", cmd: "nix log " + flakeTarget, source: "nix" },
    { label: "Stream log during build", cmd: "nix build " + flakeTarget + overrideArgs + " -L 2>&1", source: "nix" },
  ];
  const nixCmdHintCmds = [
    { label: "Reproduce this build", cmd: "nix build " + flakeTarget + overrideArgs, source: "nix" },

          <div style=${{ width: 32, height: 32, borderRadius: T.radius.md, background: cfg.bg, border: "1px solid " + cfg.color + "30", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, color: cfg.color, fontWeight: 600, boxShadow: build.status === "running" ? T.shadow.glow(cfg.color) : "none" }}>
            <span style=${{ animation: build.status === "running" ? "spin 1.5s linear infinite" : "none", display: "inline-block" }}>${cfg.icon}</span>
          </div>

        <div style=${{ minWidth: 0 }}>
          <div style=${{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3, flexWrap: "wrap" }}>

}

// ─── COMMIT GROUP ──────────────────────────────────────────
function CommitGroup({ commit, branch, owner, repo, flakeRef, builds, expandedBuild, onToggle, onFullLog }) {
  const shortSha = commit ? commit.slice(0, 7) : "—";
  const commitUrl = owner && repo && commit
    ? "https://github.com/" + owner + "/" + repo + "/commit/" + commit : null;
  const passedCnt = builds.filter(b => b.status === "passed").length;
  const failedCnt = builds.filter(b => b.status === "failed").length;
  const inStoreCnt = builds.filter(b => b.inStore).length;
  const allPassed = failedCnt === 0 && builds.every(b => b.status === "passed" || b.status === "skipped");
  const groupColor = failedCnt > 0 ? T.color.fail400 : allPassed ? T.color.pass400 : T.color.textTertiary;

  const commitHintCmds = [
    { label: "Commit details", cmd: "git log -1 --format='%H%n%s%n%an%n%ai' " + shortSha, source: "git" },
    { label: "Flake metadata", cmd: "nix flake metadata " + (flakeRef || ".") + " --json", source: "nix" },
  ];

  return html`
    <div style=${{ marginBottom: 4 }}>
      <div style=${{ display: "flex", alignItems: "center", gap: 10, padding: "10px 16px 6px", borderBottom: "1px solid " + T.color.borderSubtle }}>
        <div style=${{ width: 4, height: 4, borderRadius: "50%", background: groupColor, flexShrink: 0 }} />
        <${DataHint} commands=${commitHintCmds} position="below">
          <div style=${{ display: "flex", alignItems: "center", gap: 8, fontSize: T.fontSize.xs, flexWrap: "wrap" }}>
            <span style=${{ fontFamily: T.font.mono, padding: "1px 6px", background: T.color.surface3, borderRadius: T.radius.xs, color: T.color.textSecondary }}>⎇ ${branch || "main"}</span>
            ${commitUrl
              ? html`<a href=${commitUrl} target="_blank" rel="noopener" class="gh-link" style=${{ fontFamily: T.font.mono, fontSize: T.fontSize.xs, display: "inline-flex", alignItems: "center", gap: 4 }}><${GHIcon} size=${10} /> ${shortSha}</a>`
              : html`<span style=${{ fontFamily: T.font.mono, color: T.color.textTertiary }}>${shortSha}</span>`
            }
            <span style=${{ color: T.color.textTertiary }}>·</span>
            <span style=${{ color: T.color.textTertiary, fontSize: T.fontSize.xs }}>${flakeRef}</span>
            <span style=${{ color: T.color.textTertiary }}>·</span>
            <span style=${{ fontSize: 10, fontFamily: T.font.mono, color: T.color.textTertiary }}>${builds.length} derivation${builds.length !== 1 ? "s" : ""}</span>
            <span style=${{ fontSize: 10, fontFamily: T.font.mono, color: T.color.pass400 }}>${passedCnt}✓</span>
            ${failedCnt > 0 && html`<span style=${{ fontSize: 10, fontFamily: T.font.mono, color: T.color.fail400 }}>${failedCnt}✕</span>`}
            <span style=${{ fontSize: 10, fontFamily: T.font.mono, color: inStoreCnt > 0 ? T.color.pass400 : T.color.textTertiary }}>${inStoreCnt}/${builds.length} in store</span>
          </div>
        </${DataHint}>
      </div>
      ${builds.map(build => html`
        <${NixBuildRow} key=${build.id} build=${build} isExpanded=${expandedBuild === build.id}
          onToggle=${() => onToggle(build.id)} grouped=${true} onFullLog=${onFullLog} />
      `)}
    </div>
  `;
}

// ─── MAIN APP ───────────────────────────────────────────────
function App() {
  const [activeNav, setActiveNav] = useState("builds");
  const [expandedBuild, setExpandedBuild] = useState(null);
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [builds, setBuilds] = useState(BUILDS_DATA);
  const [meta, setMeta] = useState(META_DATA);
  const [fullLogBuildId, setFullLogBuildId] = useState(null);

  // Hash-based routing for full log view
  useEffect(() => {
    const handleHash = () => {
      const hash = window.location.hash;
      const match = hash.match(/^#log\/(\d+)$/);
      if (match) {
        setFullLogBuildId(parseInt(match[1], 10));
      } else {
        setFullLogBuildId(null);
      }
    };
    handleHash();
    window.addEventListener("hashchange", handleHash);
    return () => window.removeEventListener("hashchange", handleHash);
  }, []);

  const openFullLog = useCallback((buildId) => {
    window.location.hash = "log/" + buildId;
  }, []);

  const closeFullLog = useCallback(() => {
    window.location.hash = "";
  }, []);

  // Full log page
  if (fullLogBuildId !== null) {
    const build = builds.find(b => b.id === fullLogBuildId);
    if (build) {
      return html`<${FullLogPage} build=${build} onBack=${closeFullLog} />`;
    }
  }

  // Auto-refresh every 30s (disabled in static mode)
  useEffect(() => {
    if (STATIC_MODE) return;
    const interval = setInterval(async () => {
      try {
        const r = await fetch("/api/builds");
        if (r.ok) { const d = await r.json(); setBuilds(d.data); }
      } catch(_) {}
    }, 30000);
    return () => clearInterval(interval);
  }, []);

  const navItems = [
    { id: "builds", label: "Builds", icon: "⬡" },
    { id: "derivations", label: "Derivations", icon: "◇" },
    { id: "inputs", label: "Flake Inputs", icon: "⎇" },
    { id: "cache", label: "Cache", icon: "◈" },
  ];

  const filtered = useMemo(() => {
    let r = builds;
    if (filter !== "all") r = r.filter(b => b.status === filter);
    if (search) {
      const s = search.toLowerCase();
      r = r.filter(b =>
        b.derivation.toLowerCase().includes(s) ||
        (b.branch || "").toLowerCase().includes(s) ||
        b.flakeRef.toLowerCase().includes(s) ||
        b.commit.toLowerCase().includes(s) ||
        (b.overrideInputs || []).some(oi => oi.inputName.toLowerCase().includes(s))
      );
    }
    return r;
  }, [filter, search, builds]);

  const cnt = {
    all: builds.length,
    passed: builds.filter(b => b.status === "passed").length,
    failed: builds.filter(b => b.status === "failed").length,
    running: builds.filter(b => b.status === "running").length,
    pending: builds.filter(b => b.status === "pending").length,
    unknown: builds.filter(b => b.status === "unknown").length,
  };
  const overrideCnt = builds.filter(b => b.overrideInputs && b.overrideInputs.length > 0).length;
  const inStoreCnt = builds.filter(b => b.inStore).length;

  // Group filtered builds by commit hash
  const grouped = useMemo(() => {
    const groups = [];
    const seen = new Map();
    for (const b of filtered) {
      const key = b.commit + "|" + (b.branch || "") + "|" + b.flakeRef;
      if (!seen.has(key)) {
        const group = { commit: b.commit, branch: b.branch, owner: b.owner, repo: b.repo, flakeRef: b.flakeRef, builds: [] };
        groups.push(group);
        seen.set(key, group);
      }
      seen.get(key).builds.push(b);
    }
    return groups;
  }, [filtered]);

  const successRateHint = [
    { label: "Aggregate from build results", cmd: "susui scan . --json | jq '.stats.success_rate'", source: "shell" },
  ];
  const runningHint = [
    { label: "List active nix builds", cmd: "ps aux | grep 'nix-build\\|nix build' | grep -v grep", source: "shell" },
  ];
  const overrideHint = [
    { label: "Grep for override flags", cmd: "grep -r 'override-input' .github/workflows/ ci/", source: "shell" },
  ];
  const failedHint = [
    { label: "Find all failed derivations", cmd: "susui scan . --json | jq '[.builds[] | select(.status==\"failed\") | .derivation]'", source: "shell" },
  ];

  return html`
    <div class="root" style=${{ display: "flex" }}>
      <style>${cssText}</style>
      <nav style=${{ width: 240, height: "100vh", position: "fixed", left: 0, top: 0, background: T.color.surface0, borderRight: "1px solid " + T.color.border, padding: "24px 16px", display: "flex", flexDirection: "column", zIndex: 50 }}>
        <div style=${{ marginBottom: 32, padding: "0 8px" }}>
          <div style=${{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
            <div style=${{ width: 32, height: 32, borderRadius: T.radius.sm, background: "linear-gradient(135deg, " + T.color.saku400 + ", " + T.color.saku600 + ")", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: T.shadow.glow(T.color.saku400), overflow: "hidden" }}><${SakuIcon} size=${28} /></div>
            <div>
              <div style=${{ fontSize: T.fontSize.lg, fontWeight: 700, letterSpacing: "-0.02em", lineHeight: 1, fontFamily: T.font.display, color: T.color.textPrimary }}>nix builds</div>
              <div style=${{ fontSize: T.fontSize.xs, color: T.color.textTertiary, letterSpacing: "0.03em", marginTop: 2 }}>sus ui · 柵</div>
            </div>
          </div>
        </div>
        <div style=${{ margin: "0 8px 24px", padding: "6px 10px", background: T.color.surface2, borderRadius: T.radius.sm, fontSize: T.fontSize.xs, fontFamily: T.font.mono, color: T.color.textTertiary, display: "flex", alignItems: "center", gap: 6 }}>
          <span style=${{ width: 6, height: 6, borderRadius: "50%", background: cnt.running > 0 ? T.color.running400 : T.color.pass400, animation: cnt.running > 0 ? "pulse 1.5s infinite" : "none" }} />
          ${cnt.running > 0 ? cnt.running + " building" : "idle"} · ${cnt.all} total
        </div>
        <div style=${{ display: "flex", flexDirection: "column", gap: 2 }}>
          ${navItems.map(item => html`
            <a key=${item.id} onClick=${() => setActiveNav(item.id)}
              style=${{ padding: "8px 12px", borderRadius: T.radius.sm, fontSize: T.fontSize.md, color: activeNav === item.id ? T.color.textPrimary : T.color.textSecondary, background: activeNav === item.id ? T.color.surface2 : "transparent", textDecoration: "none", fontWeight: activeNav === item.id ? 500 : 400, transition: "all " + T.transition.fast, cursor: "pointer", display: "flex", alignItems: "center", gap: 8, borderLeft: activeNav === item.id ? "2px solid " + T.color.saku400 : "2px solid transparent" }}>
              <span style=${{ fontSize: 14, opacity: 0.7 }}>${item.icon}</span>
              ${item.label}
            </a>
          `)}
        </div>
        <div style=${{ flex: 1 }} />
        <div style=${{ padding: "10px 8px", marginBottom: 8, background: T.color.hint + "08", borderRadius: T.radius.sm, border: "1px solid " + T.color.hint + "15" }}>
          <div style=${{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
            <div style=${{ width: 5, height: 5, borderRadius: "50%", background: T.color.hint, opacity: 0.7 }} />
            <span style=${{ fontSize: 10, fontFamily: T.font.mono, color: T.color.hint, fontWeight: 500, letterSpacing: "0.04em" }}>DATA SOURCE HINTS</span>
          </div>
          <div style=${{ fontSize: 10, color: T.color.textTertiary, lineHeight: 1.5 }}>Hover any element to see the nix, git, and shell commands used to source its data.</div>
        </div>
        <div style=${{ padding: "12px 8px", borderTop: "1px solid " + T.color.border, fontSize: T.fontSize.xs, color: T.color.textTertiary, lineHeight: 1.6 }}>
          ${STATIC_MODE && html`<div style=${{ padding: "4px 8px", marginBottom: 8, background: T.color.pending400 + "12", border: "1px solid " + T.color.pending400 + "20", borderRadius: T.radius.sm, fontSize: 10, fontFamily: T.font.mono, color: T.color.pending400 }}>● Static snapshot</div>`}
          Built with precision.<br />柵 — cut clean, ship fast.
        </div>
      </nav>
      <main style=${{ marginLeft: 240, flex: 1, padding: "48px 56px", maxWidth: 960 }}>
        <div class="animate-in" style=${{ marginBottom: 32 }}>
          <div style=${{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
            <div style=${{ width: 3, height: 18, borderRadius: 2, background: T.color.saku400 }} />

          </div>
          <p style=${{ fontSize: T.fontSize.base, color: T.color.textSecondary, marginLeft: 13, maxWidth: 540 }}>

          </p>

        <div class="animate-in stagger-1" style=${{ display: "flex", gap: 12, marginBottom: 32, flexWrap: "wrap" }}>
          <${MetricCard} label="Success Rate" value=${cnt.all > 0 ? Math.round(cnt.passed / cnt.all * 100) : 0} suffix="%"
            color=${T.color.pass400} hintCommands=${successRateHint} hintNotes="Calculated as passed / total builds." />
          <${MetricCard} label="In Store" value=${inStoreCnt} suffix=${"/" + cnt.all}
            sub=${inStoreCnt === cnt.all ? "all built" : (cnt.all - inStoreCnt) + " not yet built"}
            color=${inStoreCnt === cnt.all ? T.color.pass400 : null}
            hintCommands=${[{ label: "Check store presence", cmd: "nix path-info .#<derivation>", source: "nix" }]}
            hintNotes="Number of derivation outputs present in the local nix store." />
          <${MetricCard} label="Overridden" value=${overrideCnt} sub="builds with --override-input"

          <${MetricCard} label="Failed" value=${cnt.failed}

          ${grouped.length === 1
            ? grouped[0].builds.length === 1
              ? html`<${NixBuildRow} key=${grouped[0].builds[0].id} build=${grouped[0].builds[0]} isExpanded=${expandedBuild === grouped[0].builds[0].id} onToggle=${() => setExpandedBuild(expandedBuild === grouped[0].builds[0].id ? null : grouped[0].builds[0].id)} onFullLog=${openFullLog} />`
              : html`<${CommitGroup} key=${grouped[0].commit} ...${grouped[0]} expandedBuild=${expandedBuild} onToggle=${id => setExpandedBuild(expandedBuild === id ? null : id)} onFullLog=${openFullLog} />`
            : grouped.map(g => html`
              <${CommitGroup} key=${g.commit} ...${g} expandedBuild=${expandedBuild} onToggle=${id => setExpandedBuild(expandedBuild === id ? null : id)} onFullLog=${openFullLog} />
            `)
          }
        </div>
        <div style=${{ marginTop: 40, paddingTop: 24, borderTop: "1px solid " + T.color.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style=${{ fontSize: T.fontSize.xs, color: T.color.textTertiary }}>sus ui · nix build dashboard</div>
          <div style=${{ fontSize: T.fontSize.xs, color: T.color.textTertiary, fontFamily: T.font.mono }}>柵 /saku/</div>
        </div>
      </main>
    </div>
  `;
}

render(html`<${App} />`, document.body);
</script>
</body>
</html>
